name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  quality:
    name: lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  smoke:
    name: smoke test (receiver + signed delivery)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start receiver, post a signed delivery, verify it
        run: |
          set -euo pipefail
          WORKDIR="$(mktemp -d)"
          node dist/cli.js listen --port 8799 --dir "$WORKDIR/deliveries" > "$WORKDIR/listen.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            if curl -s -o /dev/null http://127.0.0.1:8799/; then
              break
            fi
            sleep 0.5
          done

          RESPONSE=$(node -e "
            const crypto = require('crypto');
            const http = require('http');
            const body = JSON.stringify({ zen: 'Responsive is better than fast.' });
            const secret = 'whsec_ci_synthetic_smoke_secret';
            const sig = 'sha256=' + crypto.createHmac('sha256', secret).update(body).digest('hex');
            const req = http.request({
              host: '127.0.0.1', port: 8799, path: '/hooks/github', method: 'POST',
              headers: { 'content-type': 'application/json', 'x-hub-signature-256': sig, 'content-length': Buffer.byteLength(body) },
            }, (res) => {
              let data = '';
              res.on('data', (c) => (data += c));
              res.on('end', () => { console.log(data); });
            });
            req.end(body);
          ")
          echo "Capture response: $RESPONSE"
          DELIVERY_ID=$(node -e "console.log(JSON.parse(process.argv[1]).id)" "$RESPONSE")
          echo "Captured delivery id: $DELIVERY_ID"

          node dist/cli.js list --dir "$WORKDIR/deliveries"
          node dist/cli.js show "$DELIVERY_ID" --dir "$WORKDIR/deliveries"

          node dist/cli.js verify "$DELIVERY_ID" --scheme github --secret whsec_ci_synthetic_smoke_secret --dir "$WORKDIR/deliveries"

          if node dist/cli.js verify "$DELIVERY_ID" --scheme github --secret wrong-secret --dir "$WORKDIR/deliveries"; then
            echo "ERROR: verification with the wrong secret unexpectedly succeeded"
            exit 1
          fi

          echo "Smoke test passed."
